[project]
name = "slm"
version = "0.1.0"
description = "Looped decoder-only transformer on TinyStories"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Romain Zimmer", email = "hi@romainzimmer.com" }]
dependencies = [
    "tqdm>=4.66.0",
    "huggingface-hub>=0.27.0",
    "datasets>=3.0.0",
    "tokenizers>=0.20.0",
    "numpy<2; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "torch>=2.0.0,<2.3.0; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "torch>=2.0.0; platform_machine != 'x86_64' or sys_platform != 'darwin'",
]

[project.urls]
Repository = "https://github.com/romainzimmer/slm"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
download-dataset = "download:main"
train-tokenizer = "train_tokenizer:main"
tokenize-cache = "tokenize_cache:main"
train = "train:main"
resume = "resume:main"
generate = "generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
only-packages = false

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
